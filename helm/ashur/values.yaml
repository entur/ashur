common:
  labels:
    customLogRetention: enabled
  app: ashur
  shortname: ashur
  team: ror
  ingress:
    enabled: false
  service:
    externalPort: 80
    internalPort: 8080
  hpa:
    spec:
      minReplicas: 2
      maxReplicas: 2
  container:
    image: <+artifacts.primary.image>
    forceReplicas: 2
    cpu: 5
    memory: 9000
    memoryLimit: 10000
    probes:
      liveness:
        path: /actuator/health/liveness
      readiness:
        path: /actuator/health/readiness
    prometheus:
      enabled: true
      path: /actuator/prometheus
    volumeMounts:
      - mountPath: /etc/application-config
        name: application-config
        readOnly: true
    volumes:
      - configMap:
          defaultMode: 420
          name: ashur-application
        name: application-config
  configmap:
    data:
      JDK_JAVA_OPTIONS: -server -Xmx8000m -Xss512k -XX:MaxGCPauseMillis=1000
        -XX:+IgnoreUnrecognizedVMOptions --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow -Dspring.config.location=/etc/application-config/application.properties
        -Dfile.encoding=UTF-8
      TZ: Europe/Oslo
    enabled: true
    toEnv: true
