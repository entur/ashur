publiccodeYmlVersion: "0.7.0"

name: Ashur
url: https://github.com/entur/ashur

platforms:
  - web
  - linux

categories:
  - data-collection
  - geographic-information-systems

developmentStatus: stable
softwareType: standalone/backend

organisation:
  name: Entur AS
  uri: https://entur.no

usedBy:
  - Norway (nationwide), Entur AS

intendedAudience:
  scope:
    - transportation
  countries:
    - "NO"

description:
  en:
    localisedName: Ashur
    shortDescription: Filters and normalises NeTEx datasets.
    longDescription: >
      Ashur downloads NeTEx datasets announced over PubSub, filters and normalises them with rules from netex-
      tools, and uploads the result. SAX streaming keeps memory bounded for national-scale datasets.
    documentation: https://github.com/entur/ashur/blob/main/README.md
    features:
      - Rule-based filtering and normalisation of NeTEx
      - Streaming SAX processing, bounded memory
      - Event-driven over PubSub

